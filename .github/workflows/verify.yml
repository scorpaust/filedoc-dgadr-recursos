# Fase 4 (Deployment) — Pipeline de CI/CD (`context/features/db_ci_cd/fase-4-deploy-cicd.md`).
#
# Fluxo de VERIFICAÇÃO: corre em cada pull request, nunca publica nada. Separado do
# fluxo de build & publicação (`publish-images.yml`, só ao integrar em `main`), por
# razões de segurança dos segredos de publicação — este workflow corre também para
# pull requests de forks, que não têm acesso a esses segredos.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tarefa B da especificação: lint, format:check, typecheck, testes unitários, build,
  # para apps/web e apps/api — como matriz, para que as duas aplicações corram em
  # paralelo, cada uma parando no primeiro passo que falhar.
  quality:
    name: quality (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Necessário para apps/api: sem isto, `@prisma/client` fica com o stub de
      # fallback (`PrismaClient: any`) até `prisma generate` correr com sucesso — o
      # `postinstall` automático do pacote não encontra o schema a partir da raiz
      # do monorepo, o mesmo problema que o Dockerfile já contorna explicitamente.
      - if: matrix.app == 'api'
        run: npm run prisma:generate --workspace apps/api

      # Necessário para apps/web: mesmo workaround do job `e2e` (bug conhecido
      # npm/cli#4828, falta a variante linux-x64-gnu do Rollup no lockfile) — aqui
      # afeta também `ng test` (Vitest, via Vite/Rollup), não só `ng serve`.
      - if: matrix.app == 'web'
        name: Instalar binário nativo do Rollup para Linux (workaround npm/cli#4828)
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"

      - run: npm run lint --workspace apps/${{ matrix.app }}
      - run: npm run format:check --workspace apps/${{ matrix.app }}
      - run: npm run typecheck --workspace apps/${{ matrix.app }}
      - run: npm test --workspace apps/${{ matrix.app }}
      - run: npm run build --workspace apps/${{ matrix.app }}

  # Tarefa C: validação do esquema e das migrações Prisma contra um PostgreSQL efémero,
  # seguida dos testes de integração da Fase 2 (via de BD).
  db-validation:
    name: db-validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filedoc
          POSTGRES_PASSWORD: filedoc
          POSTGRES_DB: filedoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filedoc -d filedoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://filedoc:filedoc@localhost:5432/filedoc?schema=public
      # Fase 1 (Integração) — Autenticação: a aplicação não arranca sem SESSION_SECRET
      # (mínimo de 32 carateres, ver env.validation.ts); valor de CI apenas, sem
      # significado fora deste job. AUTH_LOGIN_RATE_LIMIT elevado pelo mesmo motivo
      # documentado em apps/api/.env.test.example — a suite de integração faz várias
      # dezenas de pedidos de login legítimos.
      SESSION_SECRET: ci-apenas-valor-aleatorio-com-pelo-menos-32-caracteres
      AUTH_LOGIN_RATE_LIMIT: 20
      # Fase 2 (Integração) — Armazenamento de Ficheiros: aponta para o serviço "minio"
      # acima; limiar de multipart baixo de propósito, mesma lógica de
      # apps/api/.env.test.example (exercitar esse caminho sem precisar de um ficheiro de
      # teste de 100 MB).
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: filedoc-recursos-test
      STORAGE_ACCESS_KEY: filedoc_test
      STORAGE_SECRET_KEY: filedoc_test123
      STORAGE_MULTIPART_THRESHOLD_BYTES: 5242880
      STORAGE_MULTIPART_PART_SIZE_BYTES: 5242880
      STORAGE_ORPHAN_GRACE_PERIOD_SECONDS: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Fase 2 (Integração) — Armazenamento de Ficheiros: `test:integration` inclui
      # storage.integration-spec.ts, que faz upload/download reais (não mocados) contra
      # um MinIO real. A imagem oficial "minio/minio" não arranca o servidor sem um
      # comando explícito ("server /data"), que os serviços do GitHub Actions
      # (services:) não permitem definir — por isso arranca-se aqui manualmente, mesmo
      # padrão de "arrancar em segundo plano e aguardar o health-check" já usado para a
      # própria API no job "e2e". `StorageService.onModuleInit()` cria o bucket
      # automaticamente assim que a aplicação arrancar (não é preciso criá-lo aqui).
      - name: Arrancar o MinIO em segundo plano
        run: |
          docker run -d --name minio-test -p 9000:9000 \
            -e MINIO_ROOT_USER=filedoc_test \
            -e MINIO_ROOT_PASSWORD=filedoc_test123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "O MinIO não respondeu a tempo." >&2
          exit 1

      # `npm run --workspace` (em vez de `npx prisma ...` a partir da raiz) — o
      # binário `prisma` não fica hoisted para a raiz do monorepo, só existe em
      # apps/api/node_modules/.bin; `npx` a partir da raiz não o encontra.
      - run: npm run prisma:generate --workspace apps/api

      # `prisma format` não tem uma opção `--check` nativa (ao contrário do Prettier);
      # o equivalente é formatar e falhar se isso alterar o ficheiro versionado.
      - name: prisma format --check (equivalente)
        run: |
          npm run prisma:format --workspace apps/api
          git diff --exit-code -- apps/api/prisma/schema.prisma

      - run: npm run prisma:validate --workspace apps/api

      # Aplica as migrações do zero contra a base de dados efémera (não apenas
      # verificação do histórico local) e confirma que não há divergência nem
      # migrações pendentes.
      - run: npm run prisma:migrate:deploy --workspace apps/api
      - run: npm run prisma:status --workspace apps/api

      # `test:integration` (Fase 2) já aplica as migrações de novo (idempotente) e
      # semeia a base de dados uma única vez antes da suite, incluindo o teste
      # dedicado de idempotência do seed — não repetido aqui para não duplicar essa
      # cobertura.
      - run: npm run test:integration --workspace apps/api

  # Tarefa D: build da aplicação e suite E2E (Playwright) da Fase 11 (via de UI). Usa
  # `ng serve --configuration production` (decisão já tomada na Fase 11, mantida aqui
  # sem alteração — ver `apps/web/playwright.config.ts`), mais fiel ao comportamento
  # real do que uma build de desenvolvimento.
  #
  # Desde a Fase 1 (Integração), o login já não é simulado no cliente — a suite exerce o
  # formulário real contra a API (ver e2e/fixtures/auth.ts e apps/web/playwright.config.ts),
  # pelo que este job também arranca a API NestJS em localhost:3000 (o valor por omissão de
  # `AppConfigService.apiUrl` em desenvolvimento) e uma base de dados efémera semeada com os
  # mesmos 6 utilizadores de demonstração usados pelos testes
  # (apps/web/e2e/fixtures/users.ts), a par do `ng serve`.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filedoc
          POSTGRES_PASSWORD: filedoc
          POSTGRES_DB: filedoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filedoc -d filedoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://filedoc:filedoc@localhost:5432/filedoc?schema=public
      # Valor de CI apenas, sem significado fora deste job (ver env.validation.ts).
      SESSION_SECRET: ci-apenas-valor-aleatorio-com-pelo-menos-32-caracteres
      CORS_ALLOWED_ORIGINS: http://localhost:4310
      PORT: 3000
      # A suite E2E completa faz várias dezenas de logins legítimos (um ou mais por
      # fluxo) — limite elevado para não colidir com o valor por omissão de produção (5),
      # mesma lógica documentada em apps/api/.env.test.example.
      AUTH_LOGIN_RATE_LIMIT: 50
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: filedoc-recursos-e2e
      STORAGE_ACCESS_KEY: filedoc_e2e
      STORAGE_SECRET_KEY: filedoc_e2e123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Fase 2 (Integração) — Armazenamento de Ficheiros: a aplicação não arranca sem as
      # variáveis STORAGE_* (ver env.validation.ts). Nenhum fluxo E2E desta fase exerce
      # ainda o armazenamento (sem controller próprio), mas a API precisa de um MinIO
      # alcançável para o arranque não falhar — mesmo passo do job "db-validation" (ver
      # o comentário lá sobre a imagem oficial "minio/minio" exigir um comando explícito,
      # que os serviços do GitHub Actions não permitem definir).
      - name: Arrancar o MinIO em segundo plano
        run: |
          docker run -d --name minio-e2e -p 9000:9000 \
            -e MINIO_ROOT_USER=filedoc_e2e \
            -e MINIO_ROOT_PASSWORD=filedoc_e2e123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "O MinIO não respondeu a tempo." >&2
          exit 1

      # Workaround para o bug conhecido npm/cli#4828: o `package-lock.json` só tem
      # registada a variante do binário nativo do Rollup para a plataforma onde foi
      # gerado (Windows), não para linux-x64-gnu — `npm ci` não a instala neste
      # runner, e `ng serve` (usado pelo Playwright abaixo) falha a arrancar sem ela.
      # Instala-a à parte, na versão exata já resolvida para `rollup` no lockfile,
      # sem tocar no `package-lock.json` partilhado.
      - name: Instalar binário nativo do Rollup para Linux (workaround npm/cli#4828)
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"

      - run: npm run prisma:generate --workspace apps/api
      - run: npm run prisma:migrate:deploy --workspace apps/api
      - run: npm run prisma:seed --workspace apps/api
      - run: npm run build --workspace apps/api

      - name: Arrancar a API em segundo plano (login real da suite E2E)
        run: |
          npm run start:prod --workspace apps/api &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu em /api/v1/health a tempo." >&2
          exit 1

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace apps/web

      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Análise básica de dependências (`npm audit`) — reporta vulnerabilidades sem
  # bloquear o pipeline, conforme o âmbito explícito da Fase 4 (não é um check
  # obrigatório de proteção de branch).
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm audit
        continue-on-error: true
