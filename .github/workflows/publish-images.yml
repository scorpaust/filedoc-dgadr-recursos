# Fase 4 (Deployment) — Pipeline de CI/CD (`context/features/db_ci_cd/fase-4-deploy-cicd.md`).
#
# Fluxo de BUILD & PUBLICAÇÃO: só corre ao integrar em `main` (ou ao criar uma tag
# `v*.*.*` sobre um commit de `main`) — nunca a partir de uma pull request, para que
# nenhuma origem externa não confiável tenha acesso à role de publicação (a
# autenticação AWS via OIDC só é concedida neste contexto de `push`, nunca em
# `pull_request`). Ver a secção "Imagens de produção (Docker)" do `README.md` para
# a convenção de tags.
#
# Deploy de homologação: instância Lightsail (não ECS Express Mode — decisão
# registada em `docs/deploy-homologacao.md`, motivada por custo). O deploy corre
# por SSH, correndo o `docker-compose.homolog.yml` já publicado no repositório
# diretamente no anfitrião — nunca constrói lá, só promove as imagens já
# publicadas nesta job para o ECR.
name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '651918861047'

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image: filedoc-api
          - name: web
            dockerfile: apps/web/Dockerfile
            image: filedoc-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC, sem chaves fixas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Gera sempre a tag do hash curto do commit (imutável e rastreável) e a versão
      # semântica quando o push é de uma tag `v*.*.*`. Sem `latest`: os repositórios
      # ECR têm "Tag immutability: Enabled" — uma tag, uma vez publicada, nunca pode
      # ser reatribuída a outra imagem, o que é incompatível com um alias "latest"
      # que mudaria a cada push. A tag do commit já é a fonte da verdade (nunca se
      # promove/aponta para "latest" em homologação/produção).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-homologacao:
    name: deploy (Lightsail, homologação)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Hash curto do commit
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # A instância autentica-se ao ECR com a sua própria IAM user (só pull, sem
      # chaves de administrador) — o SSH só transporta o IMAGE_TAG a promover,
      # nunca credenciais AWS. Migrações Prisma correm como passo pontual, contra a
      # revisão que vai mesmo servir tráfego, antes de "up -d" trocar os
      # containers — mesmo princípio do antigo passo `aws ecs run-task` (nunca
      # automático no arranque do contentor).
      - name: Deploy via SSH (pull, migração, up -d)
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
          IMAGE_TAG: sha-${{ steps.vars.outputs.sha_short }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s -- "$IMAGE_TAG" <<'REMOTE'
            set -euo pipefail
            cd /opt/filedoc
            export IMAGE_TAG="$1"

            aws ecr get-login-password --region eu-west-2 \
              | docker login --username AWS --password-stdin \
                  651918861047.dkr.ecr.eu-west-2.amazonaws.com

            docker compose -f docker-compose.homolog.yml --env-file .env.homolog pull

            echo "A aplicar migrações Prisma (imagem nova, antes de trocar tráfego)..."
            set +e
            # "< /dev/null" é essencial aqui: sem stdin redirecionado, "docker compose
            # run" consome os bytes restantes deste script (herdados do heredoc SSH),
            # fazendo os passos seguintes (up -d) serem ignorados em silêncio — SSH
            # ainda sai com código 0, mascarando a falha (descoberto ao testar
            # manualmente: o deploy "tinha sucesso" mas os containers nunca mudavam).
            docker compose -f docker-compose.homolog.yml --env-file .env.homolog \
              run --rm --no-deps -T api \
              node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma < /dev/null
            EXIT_CODE=$?
            set -e
            echo "Código de saída da migração: $EXIT_CODE"
            if [ "$EXIT_CODE" != "0" ]; then
              echo "::error::prisma migrate deploy falhou (exit code $EXIT_CODE) — deploy interrompido, containers não atualizados."
              exit 1
            fi

            docker compose -f docker-compose.homolog.yml --env-file .env.homolog up -d
            docker image prune -f
          REMOTE

      - name: Verificação pós-deploy (/api/v1/health)
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://filedoc-homologacao.duckdns.org/api/v1/health"; then
              echo "API saudável."
              exit 0
            fi
            echo "Tentativa $i falhou, a repetir em 5s..."
            sleep 5
          done
          echo "::error::API não respondeu saudável após o deploy."
          exit 1
