# Fase 4 (Deployment) — Pipeline de CI/CD (`context/features/db_ci_cd/fase-4-deploy-cicd.md`),
# atualizado na integração com AWS (`context/features/aws/guia-aws-deployment.md`, Secção 10).
#
# Fluxo de BUILD & PUBLICAÇÃO: só corre ao integrar em `main` (ou ao criar uma tag
# `v*.*.*` sobre um commit de `main`) — nunca a partir de uma pull request, para que
# nenhuma origem externa não confiável tenha acesso à role de publicação (a
# autenticação AWS via OIDC só é concedida neste contexto de `push`, nunca em
# `pull_request`). Não faz deploy para nenhum ambiente remoto — isso é tratado, de
# forma controlada, na Fase 5 / Secção 7 do guia AWS. Ver a secção "Imagens de
# produção (Docker)" do `README.md` para a convenção de tags.
name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '651918861047'

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image: filedoc-api
          - name: web
            dockerfile: apps/web/Dockerfile
            image: filedoc-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC, sem chaves fixas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Gera sempre a tag do hash curto do commit (imutável e rastreável) e a versão
      # semântica quando o push é de uma tag `v*.*.*`. Sem `latest`: os repositórios
      # ECR (Secção 6 do guia AWS) têm "Tag immutability: Enabled" — uma tag, uma vez
      # publicada, nunca pode ser reatribuída a outra imagem, o que é incompatível com
      # um alias "latest" que mudaria a cada push. A tag do commit já é a fonte da
      # verdade (nunca se promove/aponta para "latest" em homologação/produção).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
