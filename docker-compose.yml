services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filedoc
      POSTGRES_PASSWORD: filedoc
      POSTGRES_DB: filedoc
    ports:
      # 5433 no anfitrião: evita conflito com uma instância nativa de PostgreSQL
      # já a ocupar a porta 5432 por omissão.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filedoc -d filedoc']
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de dados efémera para os testes de integração (Fase 2, BD) — isolada da base de
  # dados de desenvolvimento acima, conforme `coding-standards.md` ("Integração: utilizar
  # PostgreSQL isolado"). Sem volume: os dados não sobrevivem a `docker compose down`.
  # Arrancar com: docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: filedoc_test
      POSTGRES_PASSWORD: filedoc_test
      POSTGRES_DB: filedoc_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filedoc_test -d filedoc_test']
      interval: 5s
      timeout: 5s
      retries: 5

  # Armazenamento de objetos de desenvolvimento (Fase 2, Integração — módulo `storage/`),
  # compatível com S3 (mesmas credenciais/porta já usadas em `docker-compose.prod.yml`,
  # Fase 3, Deployment, para não divergir de configuração entre ambientes).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: filedoc
      MINIO_ROOT_PASSWORD: filedoc123
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # Armazenamento de objetos efémero para os testes de integração — isolado do MinIO de
  # desenvolvimento acima, mesmo princípio já aplicado ao "postgres-test". Sem volume.
  # Arrancar com: docker compose --profile test up -d minio-test
  minio-test:
    image: minio/minio:latest
    profiles: ['test']
    environment:
      MINIO_ROOT_USER: filedoc_test
      MINIO_ROOT_PASSWORD: filedoc_test123
    command: server /data --console-address ":9003"
    ports:
      - '9002:9000'
      - '9003:9003'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
